[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravtest"
version = "0.5.0"
description = "A minimal 2D N-body gravity simulator with optional pygame renderer, Barnes–Hut acceleration, and collision models"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT License" }
authors = [
  { name = "GravTest Contributors" }
]
dependencies = []

[project.optional-dependencies]
gui = ["pygame>=2.5.2"]

[project.urls]
Homepage = "https://github.com/spicylemonade/gravtest"

[project.scripts]
gravtest = "gravtest.cli:main"
